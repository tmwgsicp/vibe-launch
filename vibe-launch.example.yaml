# vibe-launch 配置示例
# 复制成 vibe-launch.yaml（同目录）或 ~/.vibe-launch/config.yaml
# servers 一般不用手写 —— 跑 `vibe-launch server add` 会自动配 SSH 并写进来。
# 重活（容器/redis/反代）交给 1Panel / docker；这里只管"部署编排 + 清单"。

servers:
  myserver:
    host: your-server-ip-or-domain
    user: root
    port: 22
    # vibe-launch 自管的专用 key（server add 时自动生成并装到服务器）
    identityFile: ~/.vibe-launch/id_ed25519
    note: 海外 / 国内 / 用途随你写
    # 国内网络优化（可选）：为这台机预设镜像源，配一次持久化，docker-mirror / proxy setup 默认取用。
    # 优先级：命令行显式 > 这里的预设 > 环境变量 > 默认。UI「编辑服务器」里也能填。
    # mirrors:
    #   docker: [https://你的专属.mirror.aliyuncs.com]   # docker-mirror 默认写这些（云机优先云内网镜像）
    #   caddyUrl: https://你的镜像/caddy_linux_amd64      # proxy setup 装 Caddy 默认从这里下

projects:
  myapp:
    server: myserver
    dir: /path/to/app                      # 服务器上的代码目录（git checkout）
    # ↓ 可插拔的部署命令（在服务器上跑）—— 不挑生态，填你自己的更新方式：
    deploy: git pull && docker restart myapp-api myapp-web
    containers:                            # 用于 status 看容器状态
      - myapp-api
      - myapp-web
    health:                               # 部署后健康检查（服务器本地 curl）
      - http://127.0.0.1:8000/health

  # 别的项目可以用完全不同的部署机制 —— 工具不挑：
  # compose-app:
  #   server: myserver
  #   dir: /path/to/foo
  #   deploy: docker compose pull && docker compose up -d

  # 非容器项目（systemd / 裸进程 / venv，没有容器）：用 restartCmd 声明"怎么重启我"。
  # 这样 restart / env set --restart / rollback 都能真正重启它 —— 不再因为没 containers 而"假成功"。
  # worker:
  #   server: myserver
  #   dir: /opt/worker
  #   deploy: git pull && sudo systemctl restart my-worker my-worker-api
  #   restartCmd: sudo systemctl restart my-worker my-worker-api
  #   # containers 留空即可；restartCmd 就是它的"重启单元"

  # ── 进阶：复杂运维编排（都是可选项，按需加）──
  # fullstack:
  #   server: myserver
  #   dir: /path/to/app
  #   deploy: git pull && docker restart app-api app-worker
  #   containers: [app-api, app-worker]
  #   health: [http://127.0.0.1:8000/health]
  #   # 部署前钩子（pull 前跑，在 dir 内，逐条串行）：DB 迁移 / 备份 / 建索引。任一失败即中止，不部署。
  #   preDeploy:
  #     - docker exec app-api python manage.py migrate --noinput
  #   # 部署后钩子（deploy 成功后跑）：烟测 / 额外校验。失败即判部署失败。
  #   postDeploy:
  #     - curl -fsS http://127.0.0.1:8000/api/smoke
  #   # vl env set 默认改这个 .env（不填则 <dir>/.env）
  #   envFile: /path/to/app/.env
  #   # 前端一体部署（vl deploy fullstack --frontend）：本地 build → 传产物 → 原子替换 → 重启
  #   frontend:
  #     build: npm run build          # 在你本地跑
  #     cwd: ./web                     # 本地项目根（默认当前目录）
  #     dist: .output/public           # 本地构建产物目录
  #     target: /var/www/app           # 服务器上的目标目录（绝对路径，原子替换）
  #     restart: [app-web]             # 换完重启的容器
  #   # 反代（vl proxy）：声明域名→上游，vibe-launch 生成 Caddy 站点块 + 自动 HTTPS。
  #   # 用法：vl proxy setup <server>（装 Caddy，每台一次）→ vl proxy apply fullstack
  #   # 前提：这台机的 80/443 没被 1Panel/nginx 占（裸机 Caddy 独占；被占会告警）。
  #   proxy:
  #     domain: app.example.com        # 多个用空格分隔，如 "app.example.com www.app.example.com"
  #     upstream: 127.0.0.1:8000       # 反代到的本机上游（你的容器/进程监听）
  #     tls: true                      # 自动签发/续期证书；false 则只听 http
